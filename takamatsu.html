:root{
 --bg:#f3f1ec; --panel:#ffffff; --panel-line:#dcd7cc; --text:#1e2126; --muted:#6a6f78;
 --accent:#0b6e4f; --ok:#0a7d3f; --warn:#a85f00; --shadow:0 2px 14px rgba(30,33,38,.18);
 --tile-filter:none; --me:#2563eb;
}
@media (prefers-color-scheme: dark){
 :root:not([data-theme="light"]){
  --bg:#15171a; --panel:#1e2126; --panel-line:#2f333a; --text:#e8e6e1; --muted:#a0a5ad;
  --accent:#4cc39a; --ok:#5fd08a; --warn:#f0b35a; --shadow:0 2px 14px rgba(0,0,0,.5);
  --tile-filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.88) saturate(.7); color-scheme:dark; --me:#60a5fa;
 }
}
:root[data-theme="dark"]{
  --bg:#15171a; --panel:#1e2126; --panel-line:#2f333a; --text:#e8e6e1; --muted:#a0a5ad;
  --accent:#4cc39a; --ok:#5fd08a; --warn:#f0b35a; --shadow:0 2px 14px rgba(0,0,0,.5);
  --tile-filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.88) saturate(.7); color-scheme:dark; --me:#60a5fa;
}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
 font-family:"Noto Sans KR",system-ui,-apple-system,"Malgun Gothic","Yu Gothic",sans-serif;font-size:14px}
#map{position:fixed;inset:0;background:var(--bg)}
.leaflet-tile-pane{filter:var(--tile-filter)}
#panel{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));z-index:1000;background:var(--panel);color:var(--text);
 border:1px solid var(--panel-line);border-radius:10px;box-shadow:var(--shadow);
 padding:12px 14px;width:270px;max-width:calc(100vw - 32px);max-height:calc(100vh - 24px);overflow:auto;
 font-size:13px;line-height:1.7;box-sizing:border-box}
#panel h1{font-size:15px;font-weight:700;margin:0 0 2px;letter-spacing:-.01em}
#panel .sub{font-size:11px;color:var(--muted);line-height:1.5;margin-bottom:8px}
#legend label{display:flex;align-items:center;gap:6px;cursor:pointer}
#legend input{margin:0;accent-color:var(--accent)}
#legend .n{color:var(--muted);font-size:11px;margin-left:auto;font-variant-numeric:tabular-nums}
#all{display:flex;gap:10px;font-size:11px;margin:2px 0 4px}
#all button{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font:inherit}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;flex:none;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.rate{margin-top:6px;border-top:1px solid var(--panel-line);padding-top:5px;font-size:12px}
.rate input[type=range]{width:100%;accent-color:var(--accent);margin:2px 0 0}
.rate b{font-variant-numeric:tabular-nums}
.rate label{display:flex;gap:6px;align-items:center;margin-top:2px}
.note{font-size:11px;color:var(--muted);margin:2px 0 0 22px;line-height:1.4}
#foot{margin-top:6px;font-size:11px;color:var(--muted);line-height:1.5}
#fold{position:absolute;top:8px;right:10px;background:none;border:0;color:var(--muted);font-size:12px;cursor:pointer;padding:2px 4px}
#panel.min > *:not(h1):not(#fold){display:none}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--text);box-shadow:var(--shadow)}
.leaflet-popup-content{margin:12px 14px;line-height:1.55;font-size:12px}
.lp b{font-size:14px;display:block;margin-bottom:1px}
.lp .en{color:var(--muted);font-size:11px;margin-bottom:5px}
.lp .m{color:var(--text);margin-top:3px}
.lp .k{color:var(--muted)}
.lp .ok{color:var(--ok);font-weight:700}.lp .mid{color:var(--warn);font-weight:700}
.lp a{color:var(--accent);font-weight:500}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted)}
.leaflet-bar a{background:var(--panel);color:var(--text);border-bottom-color:var(--panel-line)}
.leaflet-control-attribution{background:var(--panel);color:var(--muted);font-size:10px}
.leaflet-control-attribution a{color:var(--accent)}
@media(max-width:600px){#panel{width:210px;font-size:12px;padding:8px 10px}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(28px + env(safe-area-inset-bottom,0px));z-index:1100;
 background:var(--panel);color:var(--text);border:1px solid var(--panel-line);border-radius:8px;box-shadow:var(--shadow);
 padding:8px 12px;font-size:13px;line-height:1.5;max-width:calc(100vw - 32px);box-sizing:border-box}
#toast a{color:var(--accent);font-weight:700}
.leaflet-bar a.locbtn{font-size:19px;line-height:30px;width:30px;height:30px}
.leaflet-bar a.locbtn.on{color:var(--me)}
.lp .dist{color:var(--me);font-weight:700}

 <div class="sub">타베로그 다카마쓰 지역 · 타베로그 3.35 이상<br>돈까스·장어·카페·양식·카레·햄버그 제외</div>
 <div id="all"><button type="button" id="aon">전부 켜기</button><button type="button" id="aoff">전부 끄기</button></div>
 <div id="legend"></div>
 <div class="rate">최소 평점 <b id="rv">3.35</b>
  <input id="sl" type="range" min="3.35" max="4.0" step="0.05" value="3.35" aria-label="최소 평점"></div>
 <div class="rate">저녁 1인 <b id="dv">제한 없음</b>
  <input id="sd" type="range" min="1000" max="11000" step="1000" value="11000" aria-label="저녁 상한"></div>
 <div class="rate">점심 1인 <b id="lv">제한 없음</b>
  <input id="sll" type="range" min="1000" max="11000" step="1000" value="11000" aria-label="점심 상한">
  <label><input id="lo" type="checkbox">점심 가격이 있는 곳만</label>
  <label><input id="ro" type="checkbox">예약 되는 곳만</label>
  <label><input id="dn" type="checkbox">오늘 영업이 끝난 곳 빼기</label>
  <div class="note" id="dnote"></div></div>
 <div id="foot">가격은 타베로그 이용자 지출 집계(1인)이고 값이 없는 가게는 가격 막대에 걸리지 않는다. 구글 평점은 없다. 길찾기는 구글지도가 현재 위치에서 도보 경로를 연다. 왼쪽 ◎ 버튼은 내 위치를 지도에 띄운다. 영업시간은 타베로그 요일별 시간이고 일본 공휴일은 반영하지 않는다.</div>
</div>
<div id="toast" role="status" hidden></div>

/37000760/", "q": "寿司 中川"}, {"name": "鮨舳", "en": "Sushi Tomo", "cat": 4, "rv": 3.86, "lat": 34.340056, "lng": 134.051574, "genre": "Sushi", "res": "Reservation only Cancellation fee applies.", "resok": true, "sn": 0, "dn": [30000, 39999], "ln": [20000, 29999], "tel": "+81-87-833-9377", "hr": [[[1080, 1230]], [[1080, 1230]], [[1080, 1230]], [[1080, 1230]], [[1080, 1230]], [[720, 840], [1080, 1230]], [[720, 840], [1080, 1230]]], "bh": "", "url": "https://tabelog.com/en/kagawa/A3701/A370101/37000358/", "q": "鮨舳"}];
var cats=[["우동·소바", "#1d4ed8"], ["라멘·츠케멘", "#c1121f"], ["덮밥(카이센동·오야코동·텐동·규동)", "#00a6a6"], ["일식(갓포·가이세키·해산물)", "#2a6f4e"], ["스시", "#e05a8a"], ["회전초밥", "#84cc16"], ["전골(나베·스키야키·샤브·오뎅·복어)", "#7b2cbf"], ["구이·튀김(야키토리·쿠시아게·텟판·호네츠키도리)", "#f77f00"], ["오코노미야키·야키소바·타코야키", "#b5651d"], ["이자카야", "#5b6b7a"], ["중식(일본식 중화·딤섬)", "#e0a100"], ["야키니쿠·호르몬", "#7f1d1d"], ["술집(바·와인바·사케바)", "#334155"], ["정식집(食堂)", "#0f766e"]];
var WEB=true, PAGES='https://fintano.github.io/food-maps/takamatsu.html';
var ATTR='<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">国土地理院</a>';
var map=L.map('map',{minZoom:5,maxZoom:18});
L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',{maxZoom:18,attribution:ATTR}).addTo(map);
var layers=cats.map(function(){return L.layerGroup().addTo(map);});
var marks=[];
// 영업 여부는 휴대폰 시계가 아니라 일본 시각(Asia/Tokyo)으로 판단한다. 구간 끝이 1440 을 넘으면 다음 날 새벽까지 연다는 뜻이다
var KD=['월','화','수','목','금','토','일'], ED=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
var JST=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Tokyo',weekday:'short',hour:'numeric',minute:'numeric',hourCycle:'h23'});
function nowJ(){var p={}; JST.formatToParts(new Date()).forEach(function(x){p[x.type]=x.value;}); return {d:ED.indexOf(p.weekday), t:(parseInt(p.hour,10)%24)*60+parseInt(p.minute,10)};}
function hm(m){m%=1440; return Math.floor(m/60)+':'+('0'+m%60).slice(-2);}
function slotTxt(a){return a.length?a.map(function(x){return hm(x[0])+'~'+hm(x[1]);}).join(', '):'휴무';}
function weekTxt(w){var g=[],key={};
 w.forEach(function(a,i){ if(a===null) return; var k=slotTxt(a); if(!(k in key)){key[k]=g.length; g.push([[],k]);} g[key[k]][0].push(KD[i]); });
 return g.map(function(x){return x[0].join('·')+' '+x[1];}).join('<br>');}
// open=지금 영업 중, later=오늘 나중에 연다, done=오늘 영업 끝, off=오늘 휴무, null=시간 정보 없음
function state(s,n){
 if(!s.hr) return null;
 var y=s.hr[(n.d+6)%7]||[], t=s.hr[n.d], i;
 for(i=0;i<y.length;i++) if(y[i][1]>1440 && n.t<y[i][1]-1440) return {k:'open',end:y[i][1]};
 if(t===null) return null;
 if(!t.length) return {k:'off'};
 for(i=0;i<t.length;i++) if(n.t>=t[i][0] && n.t<t[i][1]) return {k:'open',end:t[i][1]};
 for(i=0;i<t.length;i++) if(n.t<t[i][0]) return {k:'later',at:t[i][0]};
 return {k:'done'};
}
function stTxt(st){
 if(!st) return '<div class="m"><span class="mid">오늘 영업시간 정보 없음</span></div>';
 if(st.k==='open') return '<div class="m"><span class="ok">지금 영업 중</span> · '+hm(st.end)+'까지</div>';
 if(st.k==='later') return '<div class="m"><span class="mid">오늘 '+hm(st.at)+'에 연다</span></div>';
 return '<div class="m"><span class="mid">'+(st.k==='off'?'오늘 휴무':'오늘 영업 끝')+'</span></div>';
}
function yen(r){return (r[0]?r[0].toLocaleString():'')+'~'+r[1].toLocaleString()+'엔';}
S.forEach(function(s){
 var m=L.circleMarker([s.lat,s.lng],{radius:s.rv>=3.6?9:7,color:'#fff',weight:2,fillColor:cats[s.cat][1],fillOpacity:.95});
 var h='<div class="lp"><b>'+s.name+'</b><div class="en">'+s.en+'</div>';
 h+='<div class="m"><span class="k">타베로그</span> <b style="display:inline;font-size:13px">'+s.rv.toFixed(2)+'</b> · '+s.genre+'</div>';
 h+='<div class="m">'+(s.resok?'<span class="ok">예약 가능</span>':'<span class="mid">예약 불가</span>')+(s.res?' '+s.res.replace(/^Reservations? (available|only|unavailable|not possible)\.?/,''):'')+'</div>';
 if(s.sn) h+='<div class="m"><span class="k">좌석</span> '+s.sn+'석</div>';
 if(s.dn||s.ln){var pr=[]; if(s.dn) pr.push('저녁 '+yen(s.dn)); if(s.ln) pr.push('점심 '+yen(s.ln)); h+='<div class="m"><span class="k">1인</span> '+pr.join(' · ')+'</div>';}
 if(s.hr) h+='<div class="m"><span class="k">영업</span> '+weekTxt(s.hr)+'</div>';
 else if(s.bh) h+='<div class="m"><span class="k">영업</span> '+s.bh+'</div>';
 if(s.tel) h+='<div class="m"><span class="k">전화</span> '+s.tel+'</div>';
 h+='<div style="margin-top:6px"><a href="'+s.url+'" target="_blank" rel="noopener">타베로그</a> &middot; '
   +'<a href="https://www.google.com/maps/search/'+encodeURIComponent(s.q)+'/@'+s.lat+','+s.lng+',18z" target="_blank" rel="noopener">구글지도</a> &middot; '
   +'<a href="https://www.google.com/maps/dir/?api=1&destination='+s.lat+','+s.lng+'&travelmode=walking" target="_blank" rel="noopener">여기까지 길찾기</a></div></div>';
 m.bindPopup(function(){
  var d=stTxt(state(s,nowJ()))+(me?'<div class="m dist">내 위치에서 직선 '+fmtDist(me.distanceTo([s.lat,s.lng]))+'</div>':'');
  return h.replace('<div style="margin-top:6px">',d+'<div style="margin-top:6px">');
 },{maxWidth:300}); m.bindTooltip(s.name+' '+s.rv.toFixed(2),{direction:'top',offset:[0,-6]});
 m.s=s; marks.push(m);
});
var on=cats.map(function(){return true;});
var minrv=3.35, maxD=11000, maxL=11000, lunchOnly=false, resOnly=false, hideDone=false, NOW=nowJ();
function ok(s){
 if(s.rv<minrv) return false;
 if(maxD<11000 && s.dn && s.dn[0]>=maxD) return false;
 if(maxL<11000 && s.ln && s.ln[0]>=maxL) return false;
 if(lunchOnly && !s.ln) return false;
 if(resOnly && !s.resok) return false;
 if(hideDone){ var st=state(s,NOW); if(st && (st.k==='done'||st.k==='off')) return false; }
 return true;
}
function redraw(){
 NOW=nowJ();
 var hid=0; if(hideDone) marks.forEach(function(m){var st=state(m.s,NOW); if(st&&(st.k==='done'||st.k==='off')) hid++;});
 document.getElementById('dnote').textContent='일본 시각 '+KD[NOW.d]+'요일 '+hm(NOW.t)+' 기준'+(hideDone?' · '+hid+'곳 숨김 · 시간 정보 없는 곳은 남긴다':'');
 layers.forEach(function(l,i){l.clearLayers(); if(on[i]) l.addTo(map); else map.removeLayer(l);});
 var c=cats.map(function(){return 0;});
 marks.forEach(function(m){ if(!ok(m.s)) return; c[m.s.cat]++; m.addTo(layers[m.s.cat]); });
 cats.forEach(function(b,i){var e=document.getElementById('n'+i); if(e) e.textContent=c[i];});
}
var lg=document.getElementById('legend');
cats.forEach(function(b,i){
 var l=document.createElement('label');
 l.innerHTML='<input type="checkbox" id="cat'+i+'" checked data-i="'+i+'"><span class="dot" style="background:'+b[1]+'"></span><span>'+b[0]+'</span><span class="n" id="n'+i+'"></span>';
 lg.appendChild(l);
});
lg.addEventListener('change',function(e){var i=e.target.getAttribute('data-i'); if(i===null)return; on[i]=e.target.checked; redraw();});
function setAll(v){on=on.map(function(){return v;}); lg.querySelectorAll('input').forEach(function(x){x.checked=v;}); redraw();}
document.getElementById('aon').addEventListener('click',function(){setAll(true);});
document.getElementById('aoff').addEventListener('click',function(){setAll(false);});
document.getElementById('sl').addEventListener('input',function(e){minrv=parseFloat(e.target.value); document.getElementById('rv').textContent=minrv.toFixed(2); redraw();});
function lbl(v){return v>=11000?'제한 없음':v.toLocaleString()+'엔 미만';}
document.getElementById('sd').addEventListener('input',function(e){maxD=parseInt(e.target.value); document.getElementById('dv').textContent=lbl(maxD); redraw();});
document.getElementById('sll').addEventListener('input',function(e){maxL=parseInt(e.target.value); document.getElementById('lv').textContent=lbl(maxL); redraw();});
document.getElementById('ro').addEventListener('change',function(e){resOnly=e.target.checked; redraw();});
document.getElementById('dn').addEventListener('change',function(e){hideDone=e.target.checked; redraw();});
// 켜 둔 채로 시간이 지나면 문 닫는 가게가 생기므로 1분마다 다시 그린다
setInterval(function(){ if(hideDone) redraw(); else { NOW=nowJ(); document.getElementById('dnote').textContent='일본 시각 '+KD[NOW.d]+'요일 '+hm(NOW.t)+' 기준'; } },60000);
document.getElementById('lo').addEventListener('change',function(e){lunchOnly=e.target.checked; redraw();});
document.getElementById('fold').addEventListener('click',function(){var p=document.getElementById('panel'); p.classList.toggle('min'); this.textContent=p.classList.contains('min')?'펼치기':'접기';});
redraw();
map.fitBounds(L.featureGroup(marks).getBounds().pad(0.04));

// 내 위치 점은 클릭을 받지 않고(아래 가게 점을 가리지 않게), 우동 분류색과 헷갈리지 않게 큰 반투명 원을 두른다
// 내 위치: watchPosition 으로 파란 점과 정확도 원을 갱신한다. claude.ai 화면은 위치 요청을 거절하므로 GitHub Pages 주소로 안내한다
var toastEl=document.getElementById('toast'), toastT=null;
function toast(html,ms){toastEl.innerHTML=html; toastEl.hidden=false; clearTimeout(toastT); if(ms) toastT=setTimeout(function(){toastEl.hidden=true;},ms);}
function fmtDist(m){return m<1000?Math.round(m/10)*10+'m':(m/1000).toFixed(1)+'km';}
map.createPane('me'); map.getPane('me').style.zIndex=450;
var me=null, meDot=null, meHalo=null, meAcc=null, watchId=null, firstFix=true, btn=null;
function nearest(){var b=Infinity; marks.forEach(function(m){var d=me.distanceTo(m.getLatLng()); if(d<b)b=d;}); return b;}
function stopLocate(){ if(watchId!==null) navigator.geolocation.clearWatch(watchId); watchId=null; if(btn) btn.classList.remove('on'); }
function onPos(p){
 me=L.latLng(p.coords.latitude,p.coords.longitude);
 var acc=Math.min(p.coords.accuracy||0,2000);
 if(!meDot){
  meAcc=L.circle(me,{pane:'me',radius:acc,color:'#2563eb',weight:1,fillColor:'#2563eb',fillOpacity:.12,interactive:false}).addTo(map);
  meHalo=L.circleMarker(me,{pane:'me',radius:19,color:'#2563eb',weight:2,opacity:.9,fillColor:'#2563eb',fillOpacity:.2,interactive:false}).addTo(map);
  meDot=L.circleMarker(me,{pane:'me',radius:8,color:'#fff',weight:3,fillColor:'#2563eb',fillOpacity:1,interactive:false}).addTo(map);
 } else { meDot.setLatLng(me); meHalo.setLatLng(me); meAcc.setLatLng(me).setRadius(acc); }
 if(firstFix){
  firstFix=false;
  var n=nearest();
  if(WEB){ map.setView(me,Math.max(map.getZoom(),16)); }
  if(n>3000) toast('내 위치가 이 지도 가게들과 멀다. 가장 가까운 가게까지 직선 '+fmtDist(n)+'.',6000);
  else toast('내 위치를 표시한다. 가게를 누르면 거리가 나온다. ◎ 를 다시 누르면 끈다.',4000);
 }
}
function onErr(e){
 stopLocate();
 if(!WEB) toast('claude.ai 화면에서는 위치를 받을 수 없다. <a href="'+PAGES+'" target="_blank" rel="noopener">내 위치가 되는 같은 지도 열기</a>',0);
 else if(e && e.code===1) toast('위치 권한이 꺼져 있다. 주소창 왼쪽 사이트 설정에서 위치를 허용한 뒤 ◎ 를 다시 눌러 달라.',9000);
 else toast('위치를 못 받았다. 잠시 뒤 ◎ 를 다시 눌러 달라.',6000);
}
function startLocate(){
 if(!navigator.geolocation){ onErr(null); return; }
 btn.classList.add('on'); firstFix=true; toast('위치를 찾는 중…',0);
 try{ watchId=navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:5000,timeout:20000}); }catch(err){ onErr(err); }
}
var Locate=L.Control.extend({options:{position:'topleft'},onAdd:function(){
 var d=L.DomUtil.create('div','leaflet-bar'); var a=L.DomUtil.create('a','locbtn',d);
 a.href='#'; a.title='내 위치'; a.setAttribute('role','button'); a.setAttribute('aria-label','내 위치'); a.textContent='◎';
 L.DomEvent.on(a,'click',function(e){L.DomEvent.preventDefault(e); L.DomEvent.stopPropagation(e);
  if(watchId!==null){ stopLocate(); toast('내 위치 표시를 껐다.',2000); } else startLocate(); });
 btn=a; return d;}});
new Locate().addTo(map);
</script>
