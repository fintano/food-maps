<title>세토우치 식당 지도</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
/* 두 도시 카드만 있는 한 화면짜리 목차 */
:root{--bg:#f3f1ec;--card:#fff;--line:#dcd7cc;--text:#1e2126;--muted:#6a6f78;--accent:#0b6e4f}
@media (prefers-color-scheme: dark){:root{--bg:#15171a;--card:#1e2126;--line:#2f333a;--text:#e8e6e1;--muted:#a0a5ad;--accent:#4cc39a;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans KR",system-ui,"Malgun Gothic",sans-serif;
 padding-block:48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:520px;margin:0 auto;display:grid;gap:14px}

p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}
a.city{display:grid;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;color:var(--text);text-decoration:none}
a.city b{font-size:18px;color:var(--accent)}
a.city span{font-size:13px;color:var(--muted)}
a.city:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style></head><body><main>
